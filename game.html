<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<link rel="stylesheet" href="../style.css">

<style>
body{
    margin:0;
    background:#111827;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.logo{
    width:120px;
    height:120px;
    border-radius:25px;
    display:block;
    margin:20px auto;
}

h1{
    text-align:center;
}

.info{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:15px 0;
}

.badge{
    background:#1f2937;
    padding:8px 15px;
    border-radius:30px;
}

.download{
    display:block;
    text-align:center;
    background:#00c853;
    color:#fff;
    padding:16px;
    border-radius:12px;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
    margin:20px 0;
}

.about{
    background:#1f2937;
    padding:20px;
    border-radius:15px;
    line-height:1.8;
}
</style>

</head>

<body>

<div class="container">

<img id="logo" class="logo">

<h1 id="name"></h1>

<div class="info">

<div class="badge">
⭐ <span id="rating"></span>
</div>

<div class="badge">
🎁 <span id="bonus"></span>
</div>

</div>

<a id="download" class="download">
Download Now
</a>

<div class="about">

<h2>About Game</h2>

<p id="about"></p>

</div>

</div>

<script src="../game.js"></script>

</body>
</html>
